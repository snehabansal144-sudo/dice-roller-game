<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="stylesheet" href="dice.css">
  <title>dice roller game</title>
</head>
<body>
  <center>
    <header>
      <h1>dice roller game</h1>
      <h3>Roll the dice and see who wins!</h3>
    </header>
    <main>
      <div class="dice-container">
        <div class="player">
          <h2>Player 1</h2> 
          <div class="dice-1">
          <img class="dice" src="dice 1.jpg" alt="Dice 1" width="200" height="200">
          <h2 class="score-1">0</h2>
          </div>
        </div>
          <div class="vs">vs</div>
        <div class="player-2">
          <h2>Player 2</h2>
           <div class="dice-2">
            <img class="dice-sec" src="dice 1.jpg" alt="Dice 2" width="200" height="200">
            <h2 class="score-2">0</h2>
           </div>
        </div>
      </div>
      <div class="result-display">
        <button id="roll-button" onclick="rollDice()">Roll Dice</button>
        <div id="result"></div>
      </div>
      
    </main>
  </center>
  
</body>
<script src="dice.js"></script>
</html>
